<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #075e54;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #075e54; margin-bottom: 8px; font-size: 24px; }
        p.subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        label {
            display: block;
            color: #333;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #25d366; }
        button {
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover { background: #1ebe5d; }
        .error {
            background: #ffe5e5;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .info {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .back {
            display: block;
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 20px;
            text-decoration: none;
        }
        .back:hover { color: #075e54; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 Восстановление пароля</h1>
        <p class="subtitle">Введите свой email — мы пришлём новый пароль</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if info %}
        <div class="info">{{ info }}</div>
        {% endif %}

        {% if not info %}
        <form method="POST" action="/admin/forgot-password">
            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="master@example.com"
                   required
                   autofocus>
            <button type="submit">Получить новый пароль</button>
        </form>
        {% endif %}

        <a href="/admin/login" class="back">← Вернуться к входу</a>
    </div>
</body>
</html>
