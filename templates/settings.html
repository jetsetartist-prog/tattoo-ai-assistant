<!DOCTYPE html>
<html lang="{{ admin_lang }}" {% if admin_lang == 'he' %}dir="rtl"{% endif %}>
<head>
    <meta charset="UTF-8">
    <title>Настройки — Кабинет мастера</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
                .header {
            background: #075e54;
            color: white;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px 10px 40px;
        }
        .header-top h1 { font-size: 20px; }
        .header-nav {
            display: flex;
            gap: 20px;
            padding: 0 40px 14px 40px;
        }
        .header-nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .header-nav a:hover { opacity: 1; }
        .header-nav a.active {
            opacity: 1;
            font-weight: 600;
            border-bottom: 2px solid #25d366;
            padding-bottom: 2px;
        }
        .lang-switch {
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            transition: background 0.2s;
            line-height: 1.4;
        }
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .lang-btn.active {
            background: #25d366;
            color: white;
        }
        .header h1 { font-size: 20px; }
        
        
        
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card h2 {
            color: #075e54;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .card .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        label {
            display: block;
            color: #333;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }
        input:focus { border-color: #25d366; }
        button {
            padding: 14px 28px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1ebe5d; }
        .alert {
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .alert-error {
            background: #ffe5e5;
            color: #c00;
            border-left: 4px solid #c00;
        }
        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #25d366;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            display: inline-block;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-secondary:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    {% include '_nav.html' %}

    <div class="container">
        <div class="card">
            <h2>{{ t("settings_title", admin_lang) }}</h2>
            <p class="subtitle">{{ t("settings_subtitle", admin_lang, email=email) }}</p>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% if info %}
            <div class="alert alert-success">{{ info }}</div>
            {% endif %}

            <form method="POST" action="/admin/settings">
                <label>{{ t("settings_old_password", admin_lang) }}</label>
                <input type="password"
                       name="old_password"
                       autocomplete="current-password"
                       required>

                <label>{{ t("settings_new_password", admin_lang) }}</label>
                <input type="password"
                       name="new_password"
                       autocomplete="new-password"
                       required>

                <label>{{ t("settings_new_password2", admin_lang) }}</label>
                <input type="password"
                       name="new_password2"
                       autocomplete="new-password"
                       required>

                <div class="actions">
                    <button type="submit">{{ t("settings_save", admin_lang) }}</button>
                    <a href="/admin" class="btn-secondary">{{ t("settings_back", admin_lang) }}</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
