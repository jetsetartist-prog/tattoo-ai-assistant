<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Введите код</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #075e54;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #075e54; margin-bottom: 8px; font-size: 24px; }
        p { color: #666; margin-bottom: 24px; font-size: 14px; }
        p b { color: #333; }
        label { display: block; color: #333; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
            transition: border-color 0.2s;
            font-family: monospace;
        }
        input:focus { border-color: #25d366; }
        button {
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover { background: #1ebe5d; }
        .error {
            background: #ffe5e5;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .back {
            display: block;
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 20px;
            text-decoration: none;
        }
        .back:hover { color: #075e54; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Введите код</h1>
        <p>Мы отправили код на <b>{{ email }}</b></p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/verify">
            <input type="hidden" name="email" value="{{ email }}">
            <label>Код из письма</label>
            <input type="text" name="code" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus>
            <button type="submit">Войти</button>
        </form>

        <a href="/admin/login" class="back">← Ввести другой email</a>
    </div>
</body>
</html>
